const DATAPIPE_EXPERIMENT_ID = "V2v2j0jUtKw9";       // from pipe.jspsych.org
const PROLIFIC_COMPLETION_URL = "https://app.prolific.com/submissions/complete?cc=C1FG6FPN"; // from Prolific's "Study Completion" setup

// Fallback random ID generator, used only if the experiment is opened
// outside of Prolific (e.g. while testing), so there's still always a
// usable filename.
function randomID(length = 10) {
  const chars = "0123456789abcdefghjklmnopqrstuvwxyz";
  let result = "";
  for (let i = 0; i < length; i++) {
    result += chars[Math.floor(Math.random() * chars.length)];
  }
  return result;
}

// ---- Capture Prolific's URL parameters, if present ----
// Prolific appends ?PROLIFIC_PID=...&STUDY_ID=...&SESSION_ID=... to your
// study link automatically. Read directly from the URL here (rather than via
// jsPsych.data.getURLVariable) because we need prolific_pid BEFORE jsPsych
// exists, to use it as the DataPipe filename below.
const urlParams = new URLSearchParams(window.location.search);
const prolific_pid = urlParams.get('PROLIFIC_PID') || randomID();
const study_id = urlParams.get('STUDY_ID');
const session_id = urlParams.get('SESSION_ID');

const jsPsych = initJsPsych({
  extensions: [
    {
      type: jsPsychExtensionPipe,
      params: {
        experiment_id: DATAPIPE_EXPERIMENT_ID,
        // Using the participant's Prolific ID as the filename. This also
        // doubles as a safeguard against duplicate submissions: if someone
        // returns and completes the study twice, both saves land in the
        // same filename rather than creating two separate data files.
        filename: () => `${prolific_pid}.csv`
      }
    }
  ],
  on_finish: function () {
    // No manual save call needed here -- the extension has already been
    // staging data as trials complete, and submits the final dataset
    // automatically when the experiment ends (including on abort). This
    // on_finish just sends the participant back to Prolific.
    window.location = PROLIFIC_COMPLETION_URL;
  }
});

// EDIT this naming pattern to match how your files are actually named.
// The optional `subtitle` argument lets you override the placeholder text
// for a specific item/condition if needed; otherwise it's auto-generated.
function build_trial(item_name, condition, subtitle, picture_numbers = [1, 2, 3, 4, 5]) {
  return {
    item_name: item_name,
    condition: condition,
    fixation_image: `img/${item_name}_${condition}.png`,
    video: `videos/${item_name}_${condition}.mp4`,
    subtitle: subtitle,

    // picture_numbers sets the left-to-right order, e.g. [1,2,3,4,5] or [5,4,3,2,1].
    picture_numbers: picture_numbers,
    picture_choices: picture_numbers.map(i => `img/${item_name}_${i}.png`),

    // Stage 4 (sentence selection): SIX sentences, shown in a random order:

    // in the OTHER_SENTENCES table above.
    sentence_prompt: '<p>Attention check:<br><br> What did she say in the video?</p>',
    sentences: [subtitle, ...get_other_sentences(item_name)]
  };
}

// =========================================================
// TRIAL SEQUENCE BUILDER
// Turns ONE stimulus object into the full per-item trial sequence
// (fixation -> autoplay video -> video + picture choice -> sentence choice -> continue).
// It is used for BOTH the practice trials and the real trials, so they are
// guaranteed to look identical, and any change to the trial design only has
// to be made in this one place.
// `is_practice` is saved in every trial's data (practice: true/false) so
// practice rows are easy to filter out at analysis time.
// =========================================================
function make_trial_sequence(s, is_practice) {
  const base_data = { item_name: s.item_name, condition: s.condition, practice: is_practice };

  // Sentences are shuffled per-participant, and the resulting order is stored
  // in trial data so you can map the clicked button index back to the sentence.
  // (The 5 pictures in stage 3 are NOT shuffled: they use a fixed order.)
  const shuffled_sentences = jsPsych.randomization.shuffle(s.sentences);

  return [
    // Stage 1: fixation image for 1.5 seconds, no response needed
    {
      type: jsPsychImageKeyboardResponse,
      stimulus: s.fixation_image,
      stimulus_width: 640,
      choices: "NO_KEYS",
      trial_duration: 1500,
      response_ends_trial: false,
      data: { ...base_data, trial_stage: 'fixation' }
    },

    // Stage 2: video autoplays once, no controls, progresses automatically at the end
    {
      type: jsPsychVideoKeyboardResponse,
      stimulus: [s.video],
      width: 640,
      choices: "NO_KEYS",
      //prompt: `<p style="font-size:18px;">${s.subtitle}</p>`,
      autoplay: true,
      controls: false,
      response_allowed_while_playing: false,
      trial_ends_after_video: true,
      data: { ...base_data, trial_stage: 'video_autoprogress' }
    },

    // Stage 3: video with controls, subtitle always visible as the prompt,
    // and five pictures in a fixed order in a single row. Each button's HTML
    // is an <img>; clicking one ends the trial (built-in video-button-response).
    {
      type: jsPsychVideoButtonResponse,
      stimulus: [s.video],
      width: 640,
      //height: 400, // 360 (true 16:9 height at 640 wide) + ~40px buffer for controls
      choices: s.picture_choices.map(img => `<img src="${img}" style="width:180px; padding:4px;"/>`),
      button_layout: 'grid',
      grid_rows: 1,
      grid_columns: 5,
      prompt: `<p style="font-size:18px;">She said: \"${s.subtitle}\" <br><br> Which object do you think she\'s talking about?</p>`,
      autoplay: false,
      controls: true,
      response_allowed_while_playing: true,
      trial_ends_after_video: false,          // trial waits for a button click, not just video end
      data: {
        ...base_data,
        trial_stage: 'video_picture',
        picture_order: s.picture_choices,   // files, in the order shown (left to right)
        picture_numbers: s.picture_numbers  // e.g. [5,4,3,2,1]
      },
      on_finish: function (data) {
        // convenience fields: which picture was clicked (file + 1-based position)
        data.selected_picture = data.picture_order[data.response];
        data.selected_picture_position = data.response + 1;            // screen position (1 = leftmost)
        data.selected_picture_number = data.picture_numbers[data.response]; // which picture (choiceN)
      },
      // The plugin always renders: video -> buttons -> prompt (in that DOM order).
      // This moves the prompt element to appear right before the button group instead,
      // so the subtitle shows above the picture buttons rather than below them.
      on_load: function () {
        const displayElement = jsPsych.getDisplayElement();
        const btnGroup = displayElement.querySelector('[id$="btngroup"]');
        const promptEl = displayElement.lastElementChild;
        if (btnGroup && promptEl && promptEl !== btnGroup) {
          displayElement.insertBefore(promptEl, btnGroup);
        }
      }
    },

    // Stage 4: sentence-selection question (built-in html-button-response,
    // with each button's text being the subtitle or one of five other sentences, in random order).
    {
      type: jsPsychHtmlButtonResponse,
      stimulus: `<p style="font-size:20px;">${s.sentence_prompt}</p>`,
      choices: shuffled_sentences,
      button_layout: 'grid',
      grid_rows: 6,
      grid_columns: 1,
      data: {
        ...base_data,
        trial_stage: 'sentence_choice',
        sentence_order: shuffled_sentences, // order the sentences were actually shown in for this trial
        correct_sentence: s.subtitle
      },
      on_finish: function (data) {
        // convenience field: which sentence was actually clicked
        data.selected_sentence = data.sentence_order[data.response];
        data.selected_subtitle = (data.selected_sentence === data.correct_sentence); // true if they picked the subtitle
      }
    },

    // Stage 5: Continue button to next trial
    {
      type: jsPsychHtmlButtonResponse,
      stimulus: `<p>When you're ready, click on this button to continue. <br></p>`,
      choices: ['Continue']
    }
  ];
}

// BUILD AND RUN THE EXPERIMENT
// Wrapped in an async function because getCondition() returns a Promise --
// everything below it (stimuli, preload, timeline) depends on knowing which
// list this participant got, so it all has to wait for it.
// =========================================================
async function runExperiment() {

  // ---- Ask DataPipe which list (0-7) this participant is assigned to ----
  // Replaces the old `Math.floor(Math.random() * lists.length)` -- DataPipe
  // handles balanced assignment across participants for you. Make sure your
  // DataPipe experiment (DATAPIPE_EXPERIMENT_ID above) is configured with
  // exactly 8 conditions (0-7) to match your 8 lists.
  let list_number;
  try {
    list_number = await jsPsychExtensionPipe.getCondition(DATAPIPE_EXPERIMENT_ID);
  } catch (error) {
    document.body.innerHTML = "<p>The experiment could not be started.</p>";
    throw error;
  }
 
  // ---- Build the actual stimulus objects for the chosen list ----
  const stimuli = lists[list_number].map(entry => build_trial(entry[0], entry[1], entry[2], entry[3]));
  
  // ---- Record list assignment in the data for later analysis ----
  jsPsych.data.addProperties({
    list_number: list_number,
    picture_order_condition: lists[list_number][0][3].join('') // "12345" or "54321"
  });

  // ---- Build the practice stimulus objects ----
  // Practice trials use the same picture order as this participant's main trials.
  const practice_stimuli = practice_list.map(entry => build_trial(entry[0], entry[1], entry[2], lists[list_number][0][3]));

  // ---- Preload all media files (practice + real) ----
  const all_images = [];
  const all_videos = [];
  [...practice_stimuli, ...stimuli].forEach(s => {
    all_images.push(s.fixation_image, ...s.picture_choices);
    all_videos.push(s.video);
  });

  const preload = {
    type: jsPsychPreload,
    images: all_images,
    video: all_videos
  };

  // ---- Build the timeline ----
  const timeline = [
    preload,
    consent_trial,
    instructions_loop,
    audio_check_trial,
    ...practice_stimuli.flatMap(s => make_trial_sequence(s, true)),
    // ready_trial,
    ...stimuli.flatMap(s => make_trial_sequence(s, false))
  ];

  const demographic_survey = {
    type: jsPsychSurveyHtmlForm,
    preamble: '<p>Before we finish: <br><br></p>',
    html: `
      <p style="text-align:left; max-width:400px; margin:0 auto;">
        Are you at least 18 years old?<br>
        <label><input type="radio" name="age_18_or_older" value="yes" required> Yes</label>
        <label style="margin-left:15px;"><input type="radio" name="age_18_or_older" value="no"> No</label>
      </p>
      <br><br>
      <p style="text-align:left; max-width:400px; margin:0 auto;">
        <label for="native_language">What language(s) did you speak before the age of five?</label><br>
        <input type="text" id="native_language" name="native_language" required style="width:100%; margin-top:5px;">
      </p>
    `,
    data: { trial_stage: 'demographics' }
  };
  timeline.push(demographic_survey);

  jsPsych.run(timeline);
}

runExperiment();

</script>
</html>
